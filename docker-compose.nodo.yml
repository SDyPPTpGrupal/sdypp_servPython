# Despliegue real: UNA réplica en la máquina de una casa.
#
# Es lo que levanta el deploy.sh desde el contenedor CI/CD. La base NO está acá:
# corre en la máquina de Nomico y se alcanza por su nombre de Tailscale.
#
# Blue-green: cada color es un proyecto de compose distinto, así los dos contenedores
# conviven en la misma máquina sin pisarse el nombre.
#
#   # la que está sirviendo
#   PUERTO=8080 COLOR=blue  docker compose -f docker-compose.nodo.yml -p sdypp-blue  up -d
#
#   # la nueva, al lado, sin tocar la anterior
#   PUERTO=8081 COLOR=green docker compose -f docker-compose.nodo.yml -p sdypp-green up -d
#
#   # cuando el deploy se aborta, se baja sólo la verde y la azul nunca se enteró
#   docker compose -f docker-compose.nodo.yml -p sdypp-green down

services:
  app:
    image: sdypp-app-python:${TAG:-latest}
    build: .
    environment:
      # El color va en la identidad de la instancia: es lo que permite ver en la
      # respuesta y en la bitácora cuál de las dos atendió durante el blue-green.
      HOST_NAME: ${CASA:-casa}-${COLOR:-blue}
      CASA: ${CASA:-casa-desconocida}
      # La base compartida vive en otra máquina del tailnet.
      TP_REDIS_URL: ${TP_REDIS_URL:?falta TP_REDIS_URL, va en el .env del nodo}
    ports:
      - "${PUERTO:-8080}:8080"
    volumes:
      - ./logs/${COLOR:-blue}:/app/logs
    stop_grace_period: 15s
    restart: unless-stopped
